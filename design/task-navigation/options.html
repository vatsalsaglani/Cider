<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cider · task workspace studies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#e9e6e1;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:36px 5vw 25px;max-width:1400px;margin:auto}h1{font-size:28px;letter-spacing:-.8px;margin:8px 0 14px}header p{color:#a29a91;max-width:730px;line-height:1.6}.eyebrow{color:#e8a272;font-size:11px;letter-spacing:2px;text-transform:uppercase}nav{display:flex;gap:8px;margin-top:24px}button{font:inherit;color:inherit;cursor:pointer;background:#24211e;border:1px solid #3c332b;border-radius:9px;padding:10px 16px}button[aria-pressed=true]{background:#efab73;color:#20140c;border-color:#efab73}.study{display:none;padding:0 5vw 40px;max-width:1400px;margin:auto}.study.active{display:block}.window{border:1px solid #42362c;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 0 0,#352317 0,transparent 60%),#121212;box-shadow:0 24px 80px #0006;min-height:620px}.bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 18px;color:#938d86;border-bottom:1px solid #ffffff08;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:#665246}.dots{display:flex;gap:6px;width:70px}.arrows{font-size:18px;letter-spacing:12px;color:#d6cbc0}.layout{display:flex;min-height:576px}.rail{margin:12px;width:58px;flex-shrink:0;border:1px solid #ffffff08;border-radius:16px;background:#ffffff03;display:flex;align-items:center;flex-direction:column;gap:24px;padding:20px 0;color:#99928c;font-size:20px}.rail .selected{background:#ffffff0b;border-radius:10px;padding:9px;color:#f1bd96}.mark{color:#ffc16f}.page{flex:1;padding:32px 42px;min-width:0}.crumb{font-size:11px;color:#a2978d;margin-bottom:22px}.title-row{display:flex;align-items:center;gap:12px}h2{font-size:28px;letter-spacing:-.8px;line-height:1.2;margin:0;flex:1;font-weight:600}.quiet{color:#9f958d}.metadata{display:flex;gap:10px;margin:18px 0 30px;align-items:center}.pill{font-size:11px;border:1px solid #ffffff12;border-radius:7px;padding:6px 10px;background:#ffffff03}.status{color:#f0bc92;background:#b36f2420;border-color:#b36f2430}.copy{font-size:14px;line-height:1.7;max-width:640px;color:#cec6be}h3{font-size:12px;color:#b9afa5;font-weight:600;margin:27px 0 13px}.check{display:flex;align-items:center;gap:10px;margin:13px 0;color:#d4ccc4;font-size:13px}.circle{height:14px;width:14px;border:1px solid #6f6257;border-radius:4px}.line{border-top:1px solid #ffffff0a;margin:24px 0}.linkrow{display:flex;gap:12px;align-items:center;background:#ffffff03;border:1px solid #ffffff0a;border-radius:10px;padding:12px 14px;max-width:640px}.file{color:#d49d6b}.linkrow small{font-size:10px;color:#958b82;display:block;margin-top:4px}.chev{margin-left:auto;color:#96897d}.footer{display:flex;gap:24px;font-size:12px;color:#a3978c}.footer .active{color:#efb182}.caption{display:flex;gap:40px;margin-top:22px;line-height:1.65;color:#9c938a}.caption strong{display:block;color:#e6dcd2;font-size:14px;margin-bottom:5px}.caption>div{flex:1}.inspector{width:235px;border-left:1px solid #ffffff0b;padding:28px 20px;background:#ffffff02}.inspector h3{margin-top:0}.field{margin:22px 0;font-size:12px}.field label{display:block;color:#91867b;font-size:10px;margin-bottom:8px}.tabs{display:flex;gap:24px;margin-top:24px;border-bottom:1px solid #ffffff0c;padding-bottom:12px;font-size:12px;color:#9b9086}.tabs .active{color:#f4c6a1}.tasklist{width:240px;border-right:1px solid #ffffff0b;padding:25px 14px}.tasklist h3{margin:0 10px 20px}.taskitem{font-size:12px;line-height:1.5;padding:13px 12px;margin:4px 0;color:#b4a99d}.taskitem.selected{background:#ffffff09;border-radius:10px;color:#f5dcc6}.taskitem small{display:block;color:#928273;font-size:10px;margin-top:5px}.listpage{padding:30px}.context{font-size:11px;color:#d2a37a;background:#a46f2920;border-radius:7px;padding:9px 12px;display:inline-block;margin-bottom:26px}.notehead{font-size:24px}.limit{font-size:11px;color:#877d73;margin-top:22px}@media(max-width:950px){.inspector{width:190px}.page{padding:25px}.tasklist{width:190px}h2{font-size:24px}.caption{gap:20px}}@media(max-width:700px){.window{overflow:auto}.layout{min-width:780px}.caption{display:block}.caption>div{margin-bottom:15px}}
</style>
<header><div class="eyebrow">Cider / Design studies / 01</div><h1>A task is a place to work.</h1><p>Three directions for task details and linked notes. Each uses one title, content-sized sections, quiet controls and persistent navigation. These are layout studies, not the running app.</p><nav aria-label="Design direction"><button aria-pressed="true" data-id="document">01 · Document</button><button aria-pressed="false" data-id="inspector">02 · Inspector</button><button aria-pressed="false" data-id="split">03 · Task list</button></nav></header>
<div id="studies"></div>
<script>
const rail='<aside class="rail"><span class="mark">◒</span><span class="selected">☷</span><span>▤</span><span>⌘</span><span>◷</span></aside>';
const bar='<div class="bar"><div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><span class="arrows">‹ ›</span><span>Today / Landing page</span></div>';
const title='<div class="title-row"><h2>Draft the landing page</h2><span class="quiet">···</span></div>';
const meta='<div class="metadata"><span class="pill status">○ Planned</span><span class="pill">▦ Today</span><span class="quiet" style="font-size:11px">＋ Due date</span></div>';
const body='<p class="copy">Introduce Cider with a clear headline, a short explanation of the notch, and three feature sections. Give visitors a simple path to download the app.</p><h3>Acceptance criteria <span class="quiet">· 0 / 3</span></h3><div class="check"><span class="circle"></span>Write the headline and primary call to action</div><div class="check"><span class="circle"></span>Describe tasks, notes and agent activity</div><div class="check"><span class="circle"></span>Confirm the download and documentation links</div>';
const note='<div class="linkrow"><span class="file">▤</span><div>Landing page plan<small>Plan · Markdown note</small></div><span class="chev">↗</span></div>';
const studies=[{id:'document',content:rail+'<main class="page">'+title+meta+body+'<h3>Linked notes <span class="quiet">· 1</span></h3>'+note+'<div class="line"></div><div class="footer"><span class="active">Activity</span><span>Chats · 0</span><span style="margin-left:auto">＋ Add note</span></div><p class="limit">No activity yet</p></main>',a:'Recommended · Document-first',b:'One reading column puts the description, criteria and plan together. Metadata stays beside the title; secondary activity is below the work.',c:'Task → note → Back',d:'Opening a note replaces this page. Back restores the same task, scroll position and draft. No duplicate title or permanently empty editor.'},
{id:'inspector',content:rail+'<main class="page">'+title+'<div class="tabs"><span class="active">Overview</span><span>Notes · 1</span><span>Activity</span></div>'+body+'<h3>Plan</h3>'+note+'</main><aside class="inspector"><h3>Task details</h3><div class="field"><label>Status</label><span class="pill status">○ Planned</span></div><div class="field"><label>Planned day</label>Today, Sep 13</div><div class="field"><label>Due</label><span class="quiet">Add a due date</span></div><div class="line"></div><h3>Connections</h3><div class="field">▤ 1 linked note</div><div class="field">⌘ No chats attached</div></aside>',a:'Inspector-first',b:'The writing surface stays calm while status, scheduling and connections live in a dedicated inspector.',c:'Trade-off',d:'Good for dense task management, but a second pane competes with Cider’s sidebar. The inspector must collapse at smaller widths.'},
{id:'split',content:rail+'<aside class="tasklist"><h3>Today <span class="quiet">· 6</span></h3><div class="taskitem selected">○ Draft the landing page<small>1 linked note</small></div><div class="taskitem">○ Build the responsive page</div><div class="taskitem">○ Write getting-started docs</div><div class="taskitem">○ Document linked work</div><div class="taskitem">○ Add PR build checks</div><div class="taskitem">○ Publish with GitHub Pages</div></aside><main class="page listpage"><div class="context">‹ Draft the landing page / Plan</div><h2 class="notehead">Landing page plan</h2><p class="copy">A focused introduction to Cider: your agent work, daily tasks and Markdown notes, always within reach.</p><h3>Page structure</h3><div class="check">01 &nbsp; Hero and download</div><div class="check">02 &nbsp; Notch, tasks and notes</div><div class="check">03 &nbsp; Documentation and GitHub</div><div class="line"></div><p class="copy quiet">The task list stays visible while you read or edit a linked note.</p></main>',a:'Persistent task list',b:'Keep today’s tasks in a narrow middle column. A task or linked note occupies the same detail pane, with an explicit parent-task link.',c:'Trade-off',d:'Strong orientation for switching between tasks, but gives less room to writing and introduces another navigation column.'}];
document.getElementById('studies').innerHTML=studies.map((s,i)=>`<section class="study ${i===0?'active':''}" id="${s.id}"><div class="window">${bar}<div class="layout">${s.content}</div></div><div class="caption"><div><strong>${s.a}</strong>${s.b}</div><div><strong>${s.c}</strong>${s.d}</div></div></section>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.study').forEach(x=>x.classList.toggle('active',x.id===b.dataset.id))});
</script></html>
